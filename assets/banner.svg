<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-labelledby="title desc">
<title id="title">Aaron Jordan — Data Science, Engineering and Analytics</title>
<desc id="desc">Aaron Jordan. Data Science, Data Engineering and Data Analytics</desc>
<style>.still{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none}.still{display:inline}}</style>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#041A1C"/><stop offset="1" stop-color="#0B3D3F"/></linearGradient>
<linearGradient id="name" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300" y2="0">
<animateTransform attributeName="gradientTransform" type="translate" values="-300 0;1000 0" dur="3s" repeatCount="indefinite"/>
<stop stop-color="#2DD4BF"/><stop offset=".5" stop-color="#F0FDFA"/><stop offset="1" stop-color="#2DD4BF"/>
</linearGradient>
<radialGradient id="glow"><stop stop-color="#14B8A6" stop-opacity=".45"/><stop offset="1" stop-color="#14B8A6" stop-opacity="0"/></radialGradient>
<clipPath id="frame"><rect width="1000" height="230" rx="14"/></clipPath>
</defs>
<g clip-path="url(#frame)">
<rect width="1000" height="230" fill="url(#bg)"/>

<g class="moving">
<ellipse cx="500" cy="115" rx="420" ry="190" fill="url(#glow)">
<animate attributeName="opacity" values=".5;1;.5" dur="4s" repeatCount="indefinite"/>
</ellipse>
<ellipse cx="500" cy="115" rx="170" ry="70" fill="none" stroke="#5EEAD4" stroke-opacity=".2"/>
<ellipse cx="500" cy="115" rx="170" ry="70" fill="none" stroke="#5EEAD4" stroke-opacity=".5">
<animate attributeName="rx" values="170;300;170" dur="5s" repeatCount="indefinite"/>
<animate attributeName="ry" values="70;110;70" dur="5s" repeatCount="indefinite"/>
<animate attributeName="stroke-opacity" values=".5;0;.5" dur="5s" repeatCount="indefinite"/>
</ellipse>
<circle r="5" fill="#5EEAD4">
<animateMotion dur="6s" repeatCount="indefinite" path="M330 115 a170 70 0 1 0 340 0 a170 70 0 1 0 -340 0"/>
</circle>
<circle r="3.5" fill="#99F6E4">
<animateMotion dur="6s" begin="-3s" repeatCount="indefinite" path="M330 115 a170 70 0 1 0 340 0 a170 70 0 1 0 -340 0"/>
</circle>
</g>

<g class="moving">
<text x="500" y="112" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="50" font-weight="700" letter-spacing=".4" fill="url(#name)">Aaron Jordan
<animate attributeName="y" values="112;106;112" dur="4s" repeatCount="indefinite"/>
</text>

<text x="500" y="158" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="20" letter-spacing="3" fill="#99F6E4" opacity="0">Data Science
<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.05;.28;.33;1" dur="9s" repeatCount="indefinite"/>
</text>
<text x="500" y="158" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="20" letter-spacing="3" fill="#99F6E4" opacity="0">Data Engineering
<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.05;.28;.33;1" dur="9s" begin="3s" repeatCount="indefinite"/>
</text>
<text x="500" y="158" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="20" letter-spacing="3" fill="#99F6E4" opacity="0">Data Analytics
<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.05;.28;.33;1" dur="9s" begin="6s" repeatCount="indefinite"/>
</text>
</g>

<g class="still">
<text x="500" y="112" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="50" font-weight="700" letter-spacing=".4" fill="#CCFBF1">Aaron Jordan</text>
<text x="500" y="158" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="20" letter-spacing="3" fill="#99F6E4">Data Science · Engineering · Analytics</text>
</g>
</g>
</svg>